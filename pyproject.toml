[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fluidlab-physics"
version = "0.1.0"
requires-python = ">=3.10"
description = "Independent SI fluid mechanics teaching engine"
[project.optional-dependencies]
test = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["fluidlab_physics*", "api*"]
